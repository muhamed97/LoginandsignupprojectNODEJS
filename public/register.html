<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Simple Bank</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container d-flex align-center justify-between">
            <a href="/" class="navbar-brand">
                <i class="fas fa-university"></i>
                Simple Bank
            </a>
            <div class="navbar-nav d-flex align-center">
                <a href="/login" class="btn btn-outline">Sign In</a>
            </div>
        </div>
    </nav>

    <!-- Registration Section -->
    <section style="min-height: calc(100vh - 80px); display: flex; align-items: center; padding: 2rem 0;">
        <div class="container">
            <div class="container-sm">
                <div class="card fade-in" style="position: relative; overflow: hidden;">
                    <!-- Background Pattern -->
                    <div style="position: absolute; top: 0; right: 0; width: 200px; height: 200px; background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%); border-radius: 50%; transform: translate(50%, -50%);"></div>
                    
                    <div class="card-body" style="padding: 3rem; position: relative; z-index: 1;">
                        <div class="text-center mb-4">
                            <div style="width: 80px; height: 80px; background: linear-gradient(135deg, var(--success-color) 0%, #059669 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                                <i class="fas fa-user-plus" style="font-size: 2rem; color: white;"></i>
                            </div>
                            <h2 style="margin-bottom: 0.5rem;">Create Your Account</h2>
                            <p style="color: var(--text-secondary);">Join Simple Bank and start your financial journey</p>
                        </div>
                        
                        <form id="registerForm">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                                <div class="form-group">
                                    <label for="firstName" class="form-label">
                                        <i class="fas fa-user"></i>
                                        First Name
                                    </label>
                                    <input type="text" class="form-control" id="firstName" name="firstName" placeholder="John" required>
                                </div>
                                
                                <div class="form-group">
                                    <label for="lastName" class="form-label">
                                        <i class="fas fa-user"></i>
                                        Last Name
                                    </label>
                                    <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Doe" required>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="username" class="form-label">
                                    <i class="fas fa-at"></i>
                                    Username
                                </label>
                                <input type="text" class="form-control" id="username" name="username" placeholder="johndoe" required>
                                <small style="color: var(--text-light); font-size: 0.75rem;">Choose a unique username for your account</small>
                            </div>
                            
                            <div class="form-group">
                                <label for="email" class="form-label">
                                    <i class="fas fa-envelope"></i>
                                    Email Address
                                </label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="john@example.com" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="phone" class="form-label">
                                    <i class="fas fa-phone"></i>
                                    Phone Number
                                </label>
                                <input type="tel" class="form-control" id="phone" name="phone" placeholder="+1 (555) 123-4567">
                            </div>
                            
                            <div class="form-group">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock"></i>
                                    Password
                                </label>
                                <div style="position: relative;">
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Create a strong password" required>
                                    <button type="button" class="btn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-light);" onclick="togglePassword('password')">
                                        <i class="fas fa-eye" id="toggleIcon1"></i>
                                    </button>
                                </div>
                                <small style="color: var(--text-light); font-size: 0.75rem;">Must be at least 6 characters long</small>
                            </div>
                            
                            <div class="form-group">
                                <label for="confirmPassword" class="form-label">
                                    <i class="fas fa-lock"></i>
                                    Confirm Password
                                </label>
                                <div style="position: relative;">
                                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                                    <button type="button" class="btn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-light);" onclick="togglePassword('confirmPassword')">
                                        <i class="fas fa-eye" id="toggleIcon2"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="address" class="form-label">
                                    <i class="fas fa-map-marker-alt"></i>
                                    Address (Optional)
                                </label>
                                <textarea class="form-control" id="address" name="address" rows="3" placeholder="123 Main St, City, State, Country"></textarea>
                            </div>
                            
                            <div class="form-group" style="margin-bottom: 1.5rem;">
                                <label style="display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.875rem; color: var(--text-secondary); cursor: pointer;">
                                    <input type="checkbox" id="terms" required style="margin-top: 0.25rem;">
                                    <span>I agree to the <a href="#" style="color: var(--primary-color); text-decoration: none;">Terms of Service</a> and <a href="#" style="color: var(--primary-color); text-decoration: none;">Privacy Policy</a></span>
                                </label>
                            </div>
                            
                            <button type="submit" class="btn btn-primary btn-full btn-lg" id="registerBtn">
                                <i class="fas fa-user-plus"></i>
                                Create Account
                            </button>
                        </form>
                        
                        <div class="text-center" style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-light);">
                            <p style="color: var(--text-secondary); margin-bottom: 1rem;">Already have an account?</p>
                            <a href="/login" class="btn btn-outline btn-full">
                                <i class="fas fa-sign-in-alt"></i>
                                Sign In
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Toggle password visibility
        function togglePassword(fieldId) {
            const passwordInput = document.getElementById(fieldId);
            const toggleIcon = document.getElementById(fieldId === 'password' ? 'toggleIcon1' : 'toggleIcon2');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Password strength indicator
        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.match(/[a-z]/)) strength++;
            if (password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            return strength;
        }

        // Real-time password validation
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strength = checkPasswordStrength(password);
            const strengthText = ['Very Weak', 'Weak', 'Fair', 'Good', 'Strong'][strength - 1] || 'Very Weak';
            const strengthColor = ['#ef4444', '#f59e0b', '#f59e0b', '#10b981', '#10b981'][strength - 1] || '#ef4444';
            
            // Update password strength indicator
            let indicator = document.getElementById('passwordStrength');
            if (!indicator) {
                indicator = document.createElement('small');
                indicator.id = 'passwordStrength';
                indicator.style.marginTop = '0.25rem';
                this.parentElement.appendChild(indicator);
            }
            indicator.textContent = `Password strength: ${strengthText}`;
            indicator.style.color = strengthColor;
        });

        // Registration form submission
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const registerBtn = document.getElementById('registerBtn');
            const originalText = registerBtn.innerHTML;
            
            // Show loading state
            registerBtn.innerHTML = '<div class="loading"></div> Creating Account...';
            registerBtn.disabled = true;
            
            const formData = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };
            
            // Validate passwords match
            if (formData.password !== document.getElementById('confirmPassword').value) {
                registerBtn.innerHTML = originalText;
                registerBtn.disabled = false;
                showAlert('Passwords do not match', 'error');
                return;
            }
            
            // Validate password strength
            if (checkPasswordStrength(formData.password) < 2) {
                registerBtn.innerHTML = originalText;
                registerBtn.disabled = false;
                showAlert('Password is too weak. Please use a stronger password.', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    // Show success message
                    showAlert('Account created successfully! Redirecting to login...', 'success');
                    
                    // Add success animation
                    registerBtn.innerHTML = '<i class="fas fa-check"></i> Account Created!';
                    registerBtn.style.background = 'linear-gradient(135deg, var(--success-color) 0%, #059669 100%)';
                    
                    // Clear form
                    document.getElementById('registerForm').reset();
                    
                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    // Reset button
                    registerBtn.innerHTML = originalText;
                    registerBtn.disabled = false;
                    
                    showAlert(result.error || 'Registration failed. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                
                // Reset button
                registerBtn.innerHTML = originalText;
                registerBtn.disabled = false;
                
                showAlert('An error occurred. Please try again.', 'error');
            }
        });
        
        function showAlert(message, type) {
            // Remove existing alerts
            const existingAlert = document.querySelector('.alert');
            if (existingAlert) {
                existingAlert.remove();
            }
            
            // Create new alert
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} slide-up`;
            alertDiv.innerHTML = `
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                    ${message}
                </div>
                <button type="button" class="alert-close" onclick="this.parentElement.remove()">
                    <i class="fas fa-times"></i>
                </button>
            `;
            
            // Insert alert at the top of the form
            const form = document.getElementById('registerForm');
            form.parentNode.insertBefore(alertDiv, form);
            
            // Auto remove after 5 seconds
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.remove();
                }
            }, 5000);
        }

        // Add focus effects to form inputs
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
                this.parentElement.style.transition = 'transform 0.2s ease';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });

        // Real-time username availability check
        let usernameTimeout;
        document.getElementById('username').addEventListener('input', function() {
            clearTimeout(usernameTimeout);
            const username = this.value;
            
            if (username.length >= 3) {
                usernameTimeout = setTimeout(async () => {
                    try {
                        // This would be an API call to check username availability
                        // For now, we'll just show a loading state
                        const indicator = document.getElementById('usernameIndicator') || document.createElement('small');
                        indicator.id = 'usernameIndicator';
                        indicator.style.marginTop = '0.25rem';
                        indicator.textContent = 'Checking availability...';
                        indicator.style.color = var('--text-light');
                        this.parentElement.appendChild(indicator);
                    } catch (error) {
                        console.error('Username check error:', error);
                    }
                }, 500);
            }
        });
    </script>
</body>
</html>
